# Instagram long-lived tokens last 60 days. This refreshes the token every Monday
# and stores the new one in the IG_ACCESS_TOKEN secret (needs GH_SECRETS_TOKEN:
# fine-grained PAT, this repo only, "Secrets: read and write").
name: Refresh Instagram token
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh and store
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: |
          if [ -z "$IG_ACCESS_TOKEN" ] || [ -z "$GH_TOKEN" ]; then echo "secrets not set yet"; exit 0; fi
          RESP=$(curl -s "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=$IG_ACCESS_TOKEN")
          NEW=$(echo "$RESP" | python3 -c "import json,sys;print(json.load(sys.stdin).get('access_token',''))")
          DAYS=$(echo "$RESP" | python3 -c "import json,sys;print(int(json.load(sys.stdin).get('expires_in',0))//86400)")
          if [ -z "$NEW" ]; then echo "refresh failed (token expired or revoked?) - log in again and set IG_ACCESS_TOKEN"; exit 1; fi
          echo "::add-mask::$NEW"
          gh secret set IG_ACCESS_TOKEN --repo "${{ github.repository }}" --body "$NEW"
          echo "token refreshed, valid for $DAYS more days"
